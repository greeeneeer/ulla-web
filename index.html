<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="울라">
<meta name="theme-color" content="#0d0b0a">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>울라</title>
<style>
/* 한 화면짜리 카메라: 위 버튼줄, 3:4 미리보기, 아래 셔터줄. 카메라 앱이라 어두운 화면 하나로 고정. */
:root {
  --bg: #0d0b0a;
  --surface: #1d1916;
  --fg: #f6efe6;
  --muted: #a39686;
  --accent: #f2b56b;
  --accent-ink: #2a1a08;
  --warn: #f5d76e;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font); }
body { overflow: hidden; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }

.app {
  height: 100%;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.top {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px;
}
.top h1 { margin: 0 auto 0 0; font-size: 17px; font-weight: 700; letter-spacing: .02em; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 7px 12px; border-radius: 999px;
  background: var(--surface); font-size: 14px; font-weight: 600;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.stage {
  position: relative; flex: 1; min-height: 0;
  display: flex; align-items: center; justify-content: center;
}
#view {
  display: block; max-width: 100%; max-height: 100%;
  width: auto; height: auto;
  background: #000;
}
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s ease-out; }
.flash.on { opacity: .8; transition: none; }

.gate {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 24px; text-align: center; background: var(--bg);
}
.gate p { margin: 0; max-width: 30ch; color: var(--muted); }
.gate strong { color: var(--fg); font-size: 18px; }
.primary {
  padding: 12px 22px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700;
}

.ev-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px 0; font-size: 13px; font-weight: 600;
}
.ev-row input { flex: 1; min-width: 0; accent-color: var(--accent); }
.ev-row output { width: 2.6em; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.zoom {
  position: absolute; left: 0; right: 0; bottom: 12px;
  display: flex; justify-content: center; gap: 6px; pointer-events: none;
}
.zoom button {
  pointer-events: auto; min-width: 34px; height: 34px; padding: 0 6px; border-radius: 999px;
  background: rgba(0, 0, 0, .55); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.zoom button[aria-pressed="true"] { color: var(--accent); }
.rec {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  padding: 4px 10px; border-radius: 999px; background: #e5383b; color: #fff;
  font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.modes { display: flex; justify-content: center; gap: 24px; padding-top: 14px; }
.modes button { font-size: 14px; font-weight: 600; color: var(--muted); }
.modes button[aria-pressed="true"] { color: var(--accent); }
.shutter.video { background-color: #e5383b; }
.shutter.recording { background-color: #e5383b; padding: 18px; }
.info { text-align: center; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; padding: 10px 16px 12px; min-height: 1.4em; }
.bottom { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 28px; }
.thumb { width: 52px; height: 52px; border-radius: 10px; background: var(--surface) center / cover no-repeat; justify-self: start; }
.shutter {
  width: 76px; height: 76px; border-radius: 50%;
  border: 4px solid var(--fg); padding: 4px; background-clip: content-box; background-color: var(--fg);
  transition: transform .1s;
}
.shutter:active { transform: scale(.94); }
.flip { width: 52px; height: 52px; border-radius: 50%; background: var(--surface); justify-self: end; display: grid; place-items: center; }
.flip svg { width: 26px; height: 26px; }

.sheet {
  position: fixed; inset: 0; z-index: 5; background: rgba(13, 11, 10, .96);
  display: flex; flex-direction: column; gap: 14px;
  padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(20px, env(safe-area-inset-bottom, 0px));
}
.sheet img, .sheet video { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
.sheet .row { display: flex; gap: 10px; }
.sheet .row button { flex: 1; padding: 14px; border-radius: 14px; background: var(--surface); font-weight: 700; }
.sheet .row .primary { background: var(--accent); }
.sheet .hint { margin: 0; text-align: center; color: var(--muted); font-size: 13px; }
.sheet .meta { margin: 0; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .flash, .shutter { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>울라</h1>
    <button class="chip" id="t-look" aria-pressed="false">☀ 7</button>
    <button class="chip" id="t-mirror" aria-pressed="true">거울</button>
    <button class="chip" id="t-small" aria-pressed="false">용량 줄이기</button>
  </header>

  <main class="stage">
    <canvas id="view" width="960" height="1280"></canvas>
    <div class="flash" id="flash"></div>
    <div class="zoom" id="zoom" hidden></div>
    <div class="rec" id="rec" hidden>● 0:00</div>
    <div class="gate" id="gate">
      <strong>후보정 없이 찍는 카메라</strong>
      <p id="gate-text">카메라 영상의 한 장면을 그대로 저장해요. 기본 카메라처럼 여러 장을 합성하지 않아요.</p>
      <button class="primary" id="start">카메라 켜기</button>
    </div>
  </main>

  <div class="ev-row" id="ev-row" hidden>
    <label for="ev">노출</label>
    <input type="range" id="ev" min="-0.5" max="1.5" step="0.1" value="0.3">
    <output id="ev-val" for="ev">+0.3</output>
  </div>
  <div class="info" id="info">기본카메라 후보정 없이 그대로 저장돼요</div>
  <footer class="bottom">
    <button class="thumb" id="thumb" aria-label="마지막 사진 보기" disabled></button>
    <button class="shutter" id="shutter" aria-label="찍기" disabled></button>
    <button class="flip" id="flip" aria-label="전면·후면 바꾸기" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><path d="M9.5 13a2.5 2.5 0 0 1 4.6-1.3M14.5 13a2.5 2.5 0 0 1-4.6 1.3"/><path d="M14.4 10.2l-.3 1.5 1.5.1M9.6 15.8l.3-1.5-1.5-.1"/></svg>
    </button>
  </footer>
  <nav class="modes" id="modes" hidden>
    <button id="m-photo" aria-pressed="true">사진</button>
    <button id="m-video" aria-pressed="false">동영상</button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden>
  <img id="shot" alt="찍은 사진">
  <video id="clip" controls playsinline hidden></video>
  <p class="meta" id="shot-info"></p>
  <p class="hint" id="sheet-hint">'사진에 저장'을 누르고 공유 창에서 '이미지 저장'을 고르세요.</p>
  <div class="row">
    <button id="close">닫기</button>
    <button class="primary" id="save">사진에 저장</button>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const view = $("view");

// ---- 설정 (이 기기에만 기억) ----
const settings = { look: false, mirror: true, small: false, ev: 0.3 };
try { Object.assign(settings, JSON.parse(localStorage.getItem("ulla") || "{}")); } catch {}
delete settings.glow; delete settings.tint;
function saveSettings() { try { localStorage.setItem("ulla", JSON.stringify(settings)); } catch {} }
function bindToggle(id, key) {
  const el = $(id);
  const sync = () => el.setAttribute("aria-pressed", String(settings[key]));
  el.addEventListener("click", () => { settings[key] = !settings[key]; saveSettings(); sync(); updateInfo(); });
  sync();
}
bindToggle("t-look", "look");
bindToggle("t-mirror", "mirror");
bindToggle("t-small", "small");
{
  const slider = $("ev");
  const sync = () => {
    slider.value = settings.ev;
    $("ev-val").textContent = (settings.ev >= 0 ? "+" : "") + Number(settings.ev).toFixed(1);
  };
  slider.addEventListener("input", () => { settings.ev = Number(slider.value); saveSettings(); sync(); });
  sync();
}

let facing = "user";
let lastInfo = null;
function updateInfo() {
  $("t-mirror").disabled = facing !== "user";
  $("ev-row").hidden = !settings.look;
  $("info").textContent = (settings.look ? "아이폰 7 느낌으로 저장돼요" : "기본카메라 후보정 없이 그대로 저장돼요");
}
updateInfo();

// ---- WebGL: 미리보기와 저장을 같은 셰이더로 그린다 ----
const gl = view.getContext("webgl2", { preserveDrawingBuffer: true, antialias: false, alpha: false });

const VERT = `#version 300 es
in vec2 p; uniform float mirror; uniform float zoom; out vec2 uv; out vec2 suv;
void main() {
  suv = p * 0.5 + 0.5;
  // 디지털 확대: 가운데를 잘라 키운다.
  vec2 z = 0.5 + (suv - 0.5) / max(zoom, 1.0);
  uv = vec2(mirror > 0.5 ? 1.0 - z.x : z.x, z.y);
  gl_Position = vec4(p, 0.0, 1.0);
}`;
// 밝은 부분만 뽑아 작은 화면에 내려 그린다.
const EXTRACT = `#version 300 es
precision mediump float;
in vec2 uv; in vec2 suv; uniform sampler2D src; uniform vec2 texel; out vec4 o;
void main() {
  // 8×8 칸을 4×4로 훑어 작은 조명도 놓치지 않는다. 칸 안에서 가장 밝은 값 쪽으로 기울여 모은다.
  vec3 sum = vec3(0.0);
  for (int y = 0; y < 4; y++) for (int x = 0; x < 4; x++) {
    vec3 c = texture(src, uv + texel * vec2(float(x) * 2.0 - 3.0, float(y) * 2.0 - 3.0)).rgb;
    float l = dot(c, vec3(0.299, 0.587, 0.114));
    sum += c * smoothstep(0.7, 1.0, l);
  }
  o = vec4(min(sum * 0.25, vec3(1.0)), 1.0);
}`;
const BLUR = `#version 300 es
precision mediump float;
in vec2 suv; uniform sampler2D src; uniform vec2 dir; out vec4 o;
void main() {
  float w[5] = float[](0.204, 0.180, 0.124, 0.066, 0.028);
  vec3 c = texture(src, suv).rgb * w[0];
  for (int i = 1; i < 5; i++) {
    c += texture(src, suv + dir * float(i)).rgb * w[i];
    c += texture(src, suv - dir * float(i)).rgb * w[i];
  }
  o = vec4(c, 1.0);
}`;
// 아이폰 7 모드: 앱(Core Image)과 같은 계산 순서. 노출·번짐·색 행렬은 선형 빛에서, 톤 커브는 sRGB 값에서 한다.
const FINAL = `#version 300 es
precision highp float;
in vec2 uv; in vec2 suv; uniform sampler2D src; uniform sampler2D glow; uniform float look; uniform float gain; out vec4 o;
vec3 toLin(vec3 c) { return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c)); }
vec3 toSrgb(vec3 c) { c = clamp(c, 0.0, 1.0); return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
float curve(float x) {
  if (x < 0.25) return mix(0.02, 0.25, x / 0.25);
  if (x < 0.5) return mix(0.25, 0.52, (x - 0.25) / 0.25);
  if (x < 0.75) return mix(0.52, 0.78, (x - 0.5) / 0.25);
  return mix(0.78, 1.0, (x - 0.75) / 0.25);
}
void main() {
  vec3 c = texture(src, uv).rgb;
  if (look > 0.5) {
    vec3 lin = toLin(c) * gain;
    vec3 g = toLin(texture(glow, suv).rgb) * vec3(0.55, 0.42, 0.25);
    lin = 1.0 - (1.0 - clamp(lin, 0.0, 1.0)) * (1.0 - clamp(g, 0.0, 1.0));
    c = toSrgb(lin);
    c = vec3(curve(c.r), curve(c.g), curve(c.b));
    c = toSrgb(toLin(clamp(c, 0.0, 1.0)) * vec3(1.04, 1.01, 0.89));
  }
  o = vec4(clamp(c, 0.0, 1.0), 1.0);
}`;

function program(fs) {
  const make = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const p = gl.createProgram();
  gl.attachShader(p, make(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, make(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, "p");
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = (n) => gl.getUniformLocation(p, n);
  return { p, u };
}
function texture() {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function target(w, h) {
  const tex = texture();
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fb, w, h };
}

let progs, videoTex, glowA, glowB;
function setupGL() {
  progs = { extract: program(EXTRACT), blur: program(BLUR), final: program(FINAL) };
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  videoTex = texture();
}
function resizeTargets(w, h) {
  const gw = Math.max(1, Math.round(w / 8)), gh = Math.max(1, Math.round(h / 8));
  if (glowA && glowA.w === gw && glowA.h === gh) return;
  glowA = target(gw, gh); glowB = target(gw, gh);
}

function pass(prog, fb, w, h, setup) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.viewport(0, 0, w, h);
  gl.useProgram(prog.p);
  setup(prog.u);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function bind(unit, tex, loc) {
  gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(loc, unit);
}

function draw() {
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) return false;
  if (view.width !== w || view.height !== h) { view.width = w; view.height = h; }
  resizeTargets(w, h);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, videoTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
  const mirror = facing === "user" && settings.mirror ? 1 : 0;

  if (settings.look) {
    pass(progs.extract, glowA.fb, glowA.w, glowA.h, (u) => {
      bind(0, videoTex, u("src")); gl.uniform1f(u("mirror"), mirror); gl.uniform1f(u("zoom"), digitalZoom);
      gl.uniform2f(u("texel"), 1 / w, 1 / h);
    });
    for (const [from, to, dx, dy] of [[glowA, glowB, 1, 0], [glowB, glowA, 0, 1]]) {
      pass(progs.blur, to.fb, to.w, to.h, (u) => {
        bind(0, from.tex, u("src")); gl.uniform1f(u("mirror"), 0); gl.uniform1f(u("zoom"), 1);
        gl.uniform2f(u("dir"), dx * 1.3 / to.w, dy * 1.3 / to.h);
      });
    }
  }
  pass(progs.final, null, w, h, (u) => {
    bind(0, videoTex, u("src")); bind(1, glowA.tex, u("glow"));
    gl.uniform1f(u("mirror"), mirror); gl.uniform1f(u("zoom"), digitalZoom);
    // 찍은 뒤 빛에 2^노출을 곱한다 (앱과 같은 방식). 클수록 밝은 곳이 더 넓게 하얗게 날아간다.
    gl.uniform1f(u("look"), settings.look ? 1 : 0); gl.uniform1f(u("gain"), Math.pow(2, settings.ev));
  });
  return true;
}

// ---- 카메라 ----
const video = document.createElement("video");
video.playsInline = true; video.muted = true; video.setAttribute("playsinline", "");
let stream = null;
let mode = "photo";         // "photo" | "video"
let lens = "wide";          // 후면에서 "ultra"면 0.5× 초광각 렌즈
let digitalZoom = 1;        // 1~5, 가운데를 잘라 키운다
let ultraWideId = null;     // Safari가 알려 주는 후면 초광각 카메라

async function openCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  // 동영상은 긴 변 1920으로 가볍게, 사진은 가장 크게 받는다.
  const big = mode === "photo";
  const size = big ? { width: { ideal: 4032 }, height: { ideal: 3024 } } : { width: { ideal: 1920 }, height: { ideal: 1440 } };
  const useUltra = facing === "environment" && lens === "ultra" && ultraWideId;
  stream = await navigator.mediaDevices.getUserMedia({
    audio: mode === "video",
    video: { ...(useUltra ? { deviceId: { exact: ultraWideId } } : { facingMode: facing }), ...size, aspectRatio: { ideal: 4 / 3 } },
  }).catch((e) => {
    // 마이크를 거절해도 소리 없이 찍을 수 있게 한 번 더 시도한다.
    if (mode !== "video") throw e;
    return navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: facing, ...size } });
  });
  video.srcObject = new MediaStream(stream.getVideoTracks());
  await video.play();
  if (!ultraWideId) await findUltraWide();
  updateInfo();
  updateZoom();
}

/// 카메라 이름에 '울트라 와이드'가 있는 후면 카메라를 찾는다 (권한을 받은 뒤에야 이름이 보인다).
async function findUltraWide() {
  try {
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
    const ultra = cams.find((d) => /ultra|울트라|초광각/i.test(d.label) && !/front|전면/i.test(d.label));
    ultraWideId = ultra ? ultra.deviceId : null;
  } catch {}
}

// ---- 확대 ----
function zoomPresets() {
  return facing === "environment" && ultraWideId ? [0.5, 1, 2] : [1, 2];
}
function shownZoom() { return (lens === "ultra" ? 0.5 : 1) * digitalZoom; }
function zoomLabel(z) { return z < 1 || Math.abs(z - Math.round(z)) > 0.05 ? z.toFixed(1) : String(Math.round(z)); }
function updateZoom() {
  const box = $("zoom");
  const presets = zoomPresets(), z = shownZoom();
  const active = [...presets].reverse().find((p) => p <= z + 0.01) ?? presets[0];
  box.replaceChildren(...presets.map((p) => {
    const b = document.createElement("button");
    b.setAttribute("aria-pressed", String(p === active));
    b.textContent = p === active ? zoomLabel(z) + "×" : zoomLabel(p);
    b.addEventListener("click", () => setZoom(p));
    return b;
  }));
  box.hidden = false;
}
async function setZoom(z) {
  const wantUltra = z < 1 && ultraWideId && facing === "environment";
  const nextLens = wantUltra ? "ultra" : "wide";
  digitalZoom = Math.min(5, Math.max(1, wantUltra ? z / 0.5 : z));
  if (nextLens !== lens) {
    lens = nextLens;
    if (!recorder) await openCamera().catch(() => {});
  }
  updateZoom();
}
// 두 손가락으로 벌리고 오므려 확대한다 (지금 렌즈 안에서 디지털로).
{
  let startDist = 0, startZoom = 1;
  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  view.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) { startDist = dist(e.touches); startZoom = digitalZoom; }
  }, { passive: true });
  view.addEventListener("touchmove", (e) => {
    if (e.touches.length !== 2 || !startDist) return;
    e.preventDefault();
    digitalZoom = Math.min(5, Math.max(1, startZoom * dist(e.touches) / startDist));
    updateZoom();
  }, { passive: false });
  view.addEventListener("touchend", () => { startDist = 0; });
}

function loop() {
  draw();
  if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(loop);
  else requestAnimationFrame(loop);
}

function showGate(text, button) {
  $("gate").hidden = false;
  $("gate-text").textContent = text;
  $("start").hidden = !button;
}

// ---- 폰을 얼마나 돌려 들었는지 (화면 회전 잠금 중에도 가로 사진을 가로로 저장하려고) ----
// 중력 방향으로 판단한다. 센서 부호가 기기마다 반대일 수 있어서, 세로로 들었을 때의 y 부호로 맞춘다.
let upSign = /iPhone|iPad|iPod/.test(navigator.userAgent) ? -1 : 1;
let upCalibrated = false;
let deviceAngle = 0; // 0 세로, 90 위쪽이 왼쪽, 270 위쪽이 오른쪽, 180 거꾸로
function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null || a.y == null) return;
  const g = 9.81, x = a.x, y = a.y;
  // 처음 세로로 똑바로 든 순간에 한 번만 맞춘다 (거꾸로 든 걸 기준으로 착각하지 않게).
  if (!upCalibrated && Math.abs(y) > 0.75 * g && Math.abs(x) < 0.35 * g && screenAngle() === 0) {
    upSign = Math.sign(y); upCalibrated = true;
  }
  if (Math.abs(x) > 0.6 * g && Math.abs(x) > Math.abs(y)) deviceAngle = Math.sign(x) === upSign ? 90 : 270;
  else if (Math.abs(y) > 0.6 * g) deviceAngle = Math.sign(y) === upSign ? 0 : 180;
}
function screenAngle() {
  const a = screen.orientation?.angle ?? window.orientation ?? 0;
  return ((a % 360) + 360) % 360;
}
function startMotion() {
  const listen = () => window.addEventListener("devicemotion", onMotion);
  // iOS는 센서 권한을 버튼 누를 때 바로 물어야 한다.
  if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
    DeviceMotionEvent.requestPermission().then((s) => s === "granted" && listen()).catch(() => {});
  } else {
    listen();
  }
}

$("start").addEventListener("click", async () => {
  startMotion();
  try {
    await openCamera();
    $("gate").hidden = true;
    $("shutter").disabled = false; $("flip").disabled = false;
    $("modes").hidden = !canRecord;
    loop();
  } catch (e) {
    showGate(e && e.name === "NotAllowedError"
      ? "카메라 권한이 꺼져 있어요. 설정 › Safari › 카메라에서 '허용'으로 바꾼 뒤 다시 눌러 주세요."
      : "카메라를 열지 못했어요. 다른 앱이 카메라를 쓰고 있지 않은지 확인해 주세요.", true);
  }
});

$("flip").addEventListener("click", async () => {
  $("flip").disabled = true;
  facing = facing === "user" ? "environment" : "user";
  lens = "wide"; digitalZoom = 1;
  try { await openCamera(); } catch { facing = facing === "user" ? "environment" : "user"; await openCamera().catch(() => {}); }
  $("flip").disabled = false;
});

// ---- 찍기와 저장 ----
let lastFile = null, lastURL = null;

/// rotation: 화면에 보이는 그림을 시계 반대 방향으로 몇 도 돌려 저장할지 (0, 90, 180, 270).
/// 방금 그린 화면을 픽셀로 읽어 일반 캔버스로 옮긴다.
/// WebGL 캔버스를 바로 이미지로 내보내면 일부 iOS에서 검은 사진이 나와서 이렇게 우회한다.
function snapshot() {
  const w = view.width, h = view.height;
  const px = new Uint8Array(w * h * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  if (gl.isContextLost() || px[3] === 0) return null;
  // WebGL은 아래 줄부터 읽혀서 위아래를 뒤집는다.
  const row = w * 4, tmp = new Uint8Array(row);
  for (let top = 0, bottom = (h - 1) * row; top < bottom; top += row, bottom -= row) {
    tmp.set(px.subarray(top, top + row));
    px.copyWithin(top, bottom, bottom + row);
    px.set(tmp, bottom);
  }
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(px.buffer), w, h), 0, 0);
  return c;
}

/// 다 쓴 캔버스의 메모리를 바로 돌려준다 (iOS는 캔버스 메모리 한도가 작다).
function release(canvas) { canvas.width = 0; canvas.height = 0; }

function encode(canvas, rotation) {
  const long = Math.max(canvas.width, canvas.height);
  const s = settings.small && long > 2048 ? 2048 / long : 1;
  let src = canvas;
  if (s !== 1 || rotation) {
    const w = Math.round(canvas.width * s), h = Math.round(canvas.height * s);
    const sideways = rotation === 90 || rotation === 270;
    src = document.createElement("canvas");
    src.width = sideways ? h : w; src.height = sideways ? w : h;
    const ctx = src.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.translate(src.width / 2, src.height / 2);
    ctx.rotate(-rotation * Math.PI / 180);
    ctx.drawImage(canvas, -w / 2, -h / 2, w, h);
  }
  return new Promise((resolve) => src.toBlob((b) => {
    const result = { blob: b, w: src.width, h: src.height };
    if (src !== canvas) release(src);
    resolve(result);
  }, "image/jpeg", settings.small ? 0.5 : 0.92));
}

function sizeText(bytes) {
  return bytes >= 1048576 ? (bytes / 1048576).toFixed(1) + " MB" : Math.round(bytes / 1024) + " KB";
}

$("shutter").addEventListener("click", async () => {
  if (mode === "video") return toggleRecording();
  if (!draw()) return;
  const flash = $("flash");
  flash.classList.add("on"); requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove("on")));
  const shot = snapshot();
  if (!shot) {
    $("info").textContent = "사진을 만들지 못했어요. 페이지를 새로고침한 뒤 다시 찍어 주세요.";
    return;
  }
  $("shutter").disabled = true;
  const { blob, w, h } = await encode(shot, (deviceAngle - screenAngle() + 360) % 360);
  release(shot);
  $("shutter").disabled = false;
  if (!blob) { $("info").textContent = "사진을 만들지 못했어요. '용량 줄이기'를 켜고 다시 찍어 주세요."; return; }

  const stamp = new Date().toISOString().replace(/\D/g, "").slice(0, 14);
  showResult(new File([blob], `ulla-${stamp}.jpg`, { type: "image/jpeg" }), `${w}×${h} · ${sizeText(blob.size)}`);
});

function showResult(file, info) {
  lastFile = file;
  if (lastURL) URL.revokeObjectURL(lastURL);
  lastURL = URL.createObjectURL(file);
  lastInfo = info;
  if (file.type.startsWith("image/")) $("thumb").style.backgroundImage = `url(${lastURL})`;
  $("thumb").disabled = false;
  openSheet();
}

// ---- 동영상: 필터가 걸린 화면(캔버스)을 그대로 녹화한다 ----
const canRecord = typeof view.captureStream === "function" && typeof MediaRecorder !== "undefined";
let recorder = null, recStart = 0, recTimer = 0;

function setMode(next) {
  if (next === mode || recorder) return;
  mode = next;
  $("m-photo").setAttribute("aria-pressed", String(mode === "photo"));
  $("m-video").setAttribute("aria-pressed", String(mode === "video"));
  $("shutter").classList.toggle("video", mode === "video");
  $("shutter").setAttribute("aria-label", mode === "video" ? "녹화 시작" : "찍기");
  openCamera().catch(() => {});
}
$("m-photo").addEventListener("click", () => setMode("photo"));
$("m-video").addEventListener("click", () => setMode("video"));

function pickMime() {
  return ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"].find((t) => MediaRecorder.isTypeSupported(t)) || "";
}

function toggleRecording() {
  if (recorder) { recorder.stop(); return; }
  const out = view.captureStream(30);
  stream.getAudioTracks().forEach((t) => out.addTrack(t));
  const mime = pickMime();
  try { recorder = new MediaRecorder(out, mime ? { mimeType: mime } : undefined); }
  catch { $("info").textContent = "이 브라우저에서는 동영상을 찍을 수 없어요."; return; }
  const chunks = [];
  const w = view.width, h = view.height;
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const seconds = Math.round((performance.now() - recStart) / 1000);
    const type = recorder.mimeType || mime || "video/mp4";
    recorder = null;
    clearInterval(recTimer);
    $("rec").hidden = true;
    $("shutter").classList.remove("recording");
    $("flip").disabled = false;
    const blob = new Blob(chunks, { type });
    if (!blob.size) { $("info").textContent = "동영상을 만들지 못했어요. 다시 찍어 주세요."; return; }
    const ext = type.includes("webm") ? "webm" : "mp4";
    const stamp = new Date().toISOString().replace(/\D/g, "").slice(0, 14);
    showResult(new File([blob], `ulla-${stamp}.${ext}`, { type: type.split(";")[0] }), `${w}×${h} · ${seconds}초 · ${sizeText(blob.size)}`);
  };
  recorder.start(1000);
  recStart = performance.now();
  $("rec").hidden = false; $("rec").textContent = "● 0:00";
  recTimer = setInterval(() => {
    const s = Math.floor((performance.now() - recStart) / 1000);
    $("rec").textContent = `● ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }, 500);
  $("shutter").classList.add("recording");
  $("flip").disabled = true;
}

function openSheet() {
  const isVideo = lastFile.type.startsWith("video/");
  $("shot").hidden = isVideo;
  $("clip").hidden = !isVideo;
  if (isVideo) { $("clip").src = lastURL; $("shot").removeAttribute("src"); }
  else { $("shot").src = lastURL; $("clip").pause(); $("clip").removeAttribute("src"); }
  $("shot-info").textContent = lastInfo;
  const canShare = navigator.canShare && navigator.canShare({ files: [lastFile] });
  $("save").hidden = !canShare;
  $("save").textContent = isVideo ? "동영상 저장" : "사진에 저장";
  $("sheet-hint").textContent = canShare
    ? (isVideo ? "'동영상 저장'을 누르고 공유 창에서 '동영상 저장'을 고르세요." : "'사진에 저장'을 누르고 공유 창에서 '이미지 저장'을 고르세요.")
    : (isVideo ? "이 브라우저에서는 바로 저장할 수 없어요." : "사진을 길게 눌러 '사진 앱에 저장'을 고르세요.");
  $("sheet").hidden = false;
}
$("thumb").addEventListener("click", () => lastFile && openSheet());
$("close").addEventListener("click", () => { $("sheet").hidden = true; $("clip").pause(); });
$("save").addEventListener("click", async () => {
  try { await navigator.share({ files: [lastFile] }); $("sheet").hidden = true; } catch {}
});

// ---- 시작 전 확인 ----
if (!gl) {
  showGate("이 브라우저는 지원하지 않아요. 아이폰 Safari 최신 버전에서 열어 주세요.", false);
} else if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
  showGate("카메라를 쓰려면 https 주소로 열어야 해요. 받은 파일 말고 링크로 열어 주세요.", false);
} else {
  setupGL();
}
</script>
